<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}I Do List{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">I Do List</a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      {% if user.is_authenticated %}
        <span class="text-muted">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}
          <button class="btn btn-outline-secondary btn-sm">Log out</button></form>
      {% else %}
        <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
